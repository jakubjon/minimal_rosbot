/**:
  ros__parameters:
    use_sim_time: true

    # Frames (match minidog_sim)
    global_frame: map
    robot_base_frame: minidog/base_footprint
    odom_frame: minidog/odom

    # Shared costmap params
    transform_tolerance: 1.0

controller_server:
  ros__parameters:
    use_sim_time: true
    # Increased to 10Hz for better Ackermann steering control (reduced oscillations)
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    # Allow 10s of controller failures before giving up — WSL2 can cause
    # momentary stalls that shouldn't abort the goal.
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.50
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      max_linear_accel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: true
      # Ackermann robot cannot rotate in place — disable in-place rotation.
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 1.2
      rotate_to_heading_min_angle: 6.28
      # Ackermann needs reversing for recovery (can't spin in place).
      allow_reversing: true
      # Collision detection: be strict to prevent getting stuck near walls.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.5
      # Cost-regulated velocity scaling (slow near obstacles)
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.8
      cost_scaling_gain: 2.0
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.05

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: true
      allow_unknown: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: minidog/base_footprint
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 20
    # Custom BT for Ackermann: replanning + recovery without Spin (can't rotate in place).
    # BT XML path is set in nav2.launch.py via default_nav_to_pose_bt_xml parameter.

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: minidog/base_footprint
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    # Ackermann can't truly spin, but "spin" must be registered so the
    # default navigate_through_poses BT can load. It will fail at runtime
    # and the BT will move to the next recovery action (wait/backup).
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: minidog/base_footprint
      # Robot footprint (approx 0.45m x 0.35m Ackermann body).
      robot_radius: 0.22
      update_frequency: 1.0
      publish_frequency: 0.5
      resolution: 0.05
      track_unknown_space: true
      # Use rolling window to avoid SLAM map initialization issues.
      # The 20x20m window covers the entire 3-room arena.
      rolling_window: true
      width: 20
      height: 20
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Must be >= inscribed_radius (0.225) to avoid collision paths.
        # Lethal zone extends 0.225m from walls; cost decays to 0 at 0.25m.
        # Doorway 1.5m: non-lethal width = 1.5 - 2*0.225 = 1.05m (safe).
        inflation_radius: 0.25
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: minidog/odom
      robot_base_frame: minidog/base_footprint
      robot_radius: 0.22
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 3.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - bt_navigator
      - behavior_server
      - waypoint_follower
