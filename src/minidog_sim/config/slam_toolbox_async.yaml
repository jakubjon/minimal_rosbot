slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames must match the sim:
    # /odom: frame_id=minidog/odom, child_frame_id=minidog/base_footprint
    odom_frame: "minidog/odom"
    base_frame: "minidog/base_footprint"
    map_frame: "map"

    # Input scan
    scan_topic: "/scan"
    min_laser_range: 0.1    # match lidar <min>0.1</min> in SDF
    # Process every 5th scan (10Hz lidar -> 2Hz SLAM) to reduce CPU load
    throttle_scans: 5

    # Tolerate small TF delays
    transform_timeout: 0.5

    # Reasonable defaults for a small indoor world
    resolution: 0.05
    max_laser_range: 20.0
    map_update_interval: 2.0
    transform_publish_period: 0.05


