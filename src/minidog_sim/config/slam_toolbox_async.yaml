slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames must match the sim:
    # /odom: frame_id=minidog/odom, child_frame_id=minidog/base_footprint
    odom_frame: "odom"
    base_frame: "base_link"
    map_frame: "map"

    # Input scan
    scan_topic: "/scan"
    min_laser_range: 0.1    # match lidar <min>0.1</min> in SDF
    # Process every scan — in bag mode lidar is 6.6Hz so CPU load is manageable;
    # in sim mode 10Hz is also fine on native Linux hardware.
    throttle_scans: 1

    # Tolerate small TF delays
    transform_timeout: 0.5

    # Reasonable defaults for a small indoor world
    resolution: 0.05
    max_laser_range: 10.0
    map_update_interval: 1.0
    transform_publish_period: 0.05


